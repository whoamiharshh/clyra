[project]
name = "confidagent"
version = "0.1.0"
description = "Token-efficient coding agent with staleness detection"
requires-python = ">=3.10"
dependencies = [
    "rich==13.7.0",
    "tavily-python==0.3.3",
    "python-dotenv==1.0.0",
    "openai==1.12.0",
    "httpx==0.27.0",
    "aiohttp>=3.11,<4",
]

[project.optional-dependencies]
# LLMLingua-2 prompt compression for large code excerpts (optional).
# The agent must run without it: kernel.compress degrades gracefully.
compression = [
    "llmlingua>=0.2.1",
]
